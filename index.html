<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0}</style>
<title>Shelf Check</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: one phone-width column. Scan screen (viewfinder, sample shelf, manual entry) swaps with a result screen (barcode, ownership chain, four scored areas). */
:root {
  --bg: #F2F4F6;
  --surface: #FFFFFF;
  --ink: #0E1A24;
  --muted: #56646F;
  --line: #D7DDE2;
  --chip: #E8ECEF;
  --accent: #FFD23F;
  --on-accent: #0E1A24;
  --scope: #0A1016;
  --scope-ink: #A9B6C1;
  --laser: #FF4A3D;
  --clear: #17734D;
  --clear-bg: #DDF3E8;
  --minor: #8F5200;
  --minor-bg: #FBE9CC;
  --serious: #A3201F;
  --serious-bg: #F9DAD8;
  --font-display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1117; --surface: #141D26; --ink: #EAF0F4; --muted: #96A5B1; --line: #25323E; --chip: #1E2A35;
    --clear: #5FD3A0; --clear-bg: #12332A; --minor: #F2B25C; --minor-bg: #3A2A10; --serious: #FF8A84; --serious-bg: #401A19;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1117; --surface: #141D26; --ink: #EAF0F4; --muted: #96A5B1; --line: #25323E; --chip: #1E2A35;
  --clear: #5FD3A0; --clear-bg: #12332A; --minor: #F2B25C; --minor-bg: #3A2A10; --serious: #FF8A84; --serious-bg: #401A19;
  color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.5 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
*, *::before, *::after { box-sizing: border-box; }
.app { max-width: 560px; margin: 0 auto; padding-block: 16px 56px; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 28px; }
.brand { display: flex; align-items: center; gap: 10px; font: 600 18px/1 var(--font-display); letter-spacing: -0.01em; }
.brand svg { width: 26px; height: 22px; color: var(--ink); }
.sample-chip {
  font: 500 11px/1 var(--font-data); letter-spacing: 0.06em; text-transform: uppercase;
  background: var(--accent); color: var(--on-accent); padding: 6px 8px; border-radius: 4px;
}

h1 { font: 700 30px/1.1 var(--font-display); letter-spacing: -0.02em; margin: 0 0 10px; text-wrap: balance; }
h2 { font: 600 12px/1 var(--font-data); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 32px 0 12px; }
h3 { font: 600 17px/1.2 var(--font-display); margin: 0; }
p { margin: 0; }
.lede { color: var(--muted); max-width: 46ch; margin-bottom: 20px; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
h1:focus { outline: none; }

/* Viewfinder */
.vf {
  position: relative; aspect-ratio: 16 / 10; max-width: 100%;
  background: var(--scope); border-radius: 14px; overflow: hidden;
  display: grid; place-items: center; color: var(--scope-ink);
}
.vf .corner { position: absolute; width: 26px; height: 26px; border: 0 solid var(--accent); }
.vf .tl { top: 14px; left: 14px; border-top-width: 3px; border-left-width: 3px; border-top-left-radius: 6px; }
.vf .tr { top: 14px; right: 14px; border-top-width: 3px; border-right-width: 3px; border-top-right-radius: 6px; }
.vf .bl { bottom: 14px; left: 14px; border-bottom-width: 3px; border-left-width: 3px; border-bottom-left-radius: 6px; }
.vf .br { bottom: 14px; right: 14px; border-bottom-width: 3px; border-right-width: 3px; border-bottom-right-radius: 6px; }
.vf .hint { font: 400 13px/1.45 var(--font-body); text-align: center; max-width: 24ch; padding: 0 12px; }
.vf .code { display: none; width: 62%; background: #fff; padding: 10px 12px; border-radius: 6px; color: #000; }
.vf .code svg { display: block; width: 100%; height: 56px; }
.vf.scanning .hint { display: none; }
.vf.scanning .code { display: block; }
.laser {
  position: absolute; left: 8%; right: 8%; top: 18%; height: 2px; background: var(--laser);
  box-shadow: 0 0 12px 2px rgba(255, 74, 61, 0.55);
  animation: sweep 2.2s ease-in-out infinite alternate;
}
.vf.scanning .laser { animation-duration: 0.7s; }
@keyframes sweep { from { top: 18%; } to { top: 80%; } }
@media (prefers-reduced-motion: reduce) { .laser { animation: none; top: 50%; } }

/* Sample shelf */
.shelf { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.shelf li { border-bottom: 1px solid var(--line); }
.shelf button {
  all: unset; box-sizing: border-box; cursor: pointer; width: 100%;
  display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 4px;
}
.shelf button:hover .pname { text-decoration: underline; }
.shelf button:focus-visible { outline: 3px solid var(--ink); outline-offset: -2px; }
.shelf .meta { min-width: 0; }
.pname { font-weight: 600; display: block; }
.psub { color: var(--muted); font-size: 13px; display: block; }
.gtin { font: 400 12px/1 var(--font-data); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* Manual entry */
.manual { display: flex; gap: 8px; flex-wrap: wrap; }
.manual input {
  flex: 1 1 200px; min-width: 0; font: 400 16px/1 var(--font-data); letter-spacing: 0.04em;
  padding: 14px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.btn {
  font: 600 15px/1 var(--font-body); padding: 14px 18px; border-radius: 8px; border: 0; cursor: pointer;
  background: var(--accent); color: var(--on-accent);
}
.btn:hover { filter: brightness(0.96); }
.msg { min-height: 22px; margin-top: 10px; font-size: 13px; color: var(--muted); }
.msg.bad { color: var(--serious); }

/* Result */
.back { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; margin-bottom: 18px; }
.back:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.sub { color: var(--muted); margin-bottom: 18px; }
.tag {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px;
  display: grid; gap: 12px;
}
.tag .bars { color: var(--ink); }
.tag .bars svg { display: block; width: 100%; height: 54px; }
.tag .row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
.region { font-size: 12px; color: var(--muted); }

.verdict { margin-top: 20px; }
.verdict .big { font: 600 22px/1.2 var(--font-display); text-wrap: balance; margin-bottom: 6px; }
.areas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
.area { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px; display: grid; gap: 8px; align-content: start; }
.area .nm { font-size: 13px; font-weight: 500; }
.pill { font: 600 11px/1 var(--font-data); letter-spacing: 0.06em; text-transform: uppercase; padding: 5px 7px; border-radius: 4px; justify-self: start; }
.pill.l0 { background: var(--clear-bg); color: var(--clear); }
.pill.l1 { background: var(--minor-bg); color: var(--minor); }
.pill.l2 { background: var(--serious-bg); color: var(--serious); }

.chain { list-style: none; margin: 0; padding: 0; }
.chain li { position: relative; padding: 0 0 18px 28px; }
.chain li:last-child { padding-bottom: 0; }
.chain li::before { content: ""; position: absolute; left: 5px; top: 8px; bottom: -8px; width: 2px; background: var(--line); }
.chain li:last-child::before { display: none; }
.chain li::after { content: ""; position: absolute; left: 0; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--ink); }
.chain li:last-child::after { background: var(--ink); }
.chain .role { font: 500 11px/1 var(--font-data); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 4px; }
.chain .who { font-weight: 600; }
.chain .note { color: var(--muted); font-size: 13px; }

.cat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 10px; }
.cat header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 4px; }
.none { color: var(--muted); font-size: 14px; margin-top: 6px; }
.finds { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 14px; }
.finds li { border-top: 1px solid var(--line); padding-top: 12px; }
.finds .m { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
.chip { font: 500 11px/1 var(--font-data); background: var(--chip); color: var(--muted); padding: 5px 7px; border-radius: 4px; }
.chip.sev1 { background: var(--minor-bg); color: var(--minor); }
.chip.sev2 { background: var(--serious-bg); color: var(--serious); }
.finds .t { overflow-wrap: anywhere; }
.finds .src { font: 400 12px/1.4 var(--font-data); color: var(--muted); margin-top: 6px; overflow-wrap: anywhere; }
.finds .caveat { font-size: 13px; color: var(--muted); font-style: italic; margin-top: 6px; }

.alts { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.alts li { padding: 12px 4px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
details { margin-top: 28px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 14px 16px; }
summary { cursor: pointer; font-weight: 600; }
details p { margin-top: 10px; color: var(--muted); font-size: 14px; }
.foot { margin-top: 28px; font-size: 12px; color: var(--muted); }
</style>

<div class="app">
  <div class="topbar">
    <div class="brand">
      <svg viewBox="0 0 26 22" aria-hidden="true" fill="currentColor"><rect x="0" y="0" width="2" height="22"/><rect x="4" y="0" width="1" height="22"/><rect x="7" y="0" width="3" height="22"/><rect x="12" y="0" width="1" height="22"/><rect x="15" y="0" width="2" height="22"/><rect x="19" y="0" width="1" height="22"/><rect x="22" y="0" width="4" height="22"/></svg>
      <span>Shelf Check</span>
    </div>
    <span class="sample-chip">Sample data</span>
  </div>

  <main id="view"></main>
</div>

<script>
(function () {
  var CATS = [
    { k: "env", n: "Environment" },
    { k: "lab", n: "Labor and human rights" },
    { k: "law", n: "Corruption and legal" },
    { k: "pol", n: "Political and personal ties" }
  ];
  var TIERS = {
    judgment: "Court judgment",
    regulator: "Regulator finding",
    reporting: "Credible reporting",
    record: "Public record mention",
    allegation: "Unverified allegation"
  };
  var SCORED = { judgment: 1, regulator: 1, reporting: 1 };
  var LVL = ["Clear", "Minor", "Serious"];

  function check(b12) { var s = 0; for (var i = 0; i < 12; i++) s += +b12[i] * (i % 2 ? 3 : 1); return (10 - s % 10) % 10; }
  function gt(b12) { return b12 + check(b12); }

  var REGIONS = [
    [0, 139, "US and Canada"], [300, 379, "France"], [400, 440, "Germany"], [450, 459, "Japan"], [490, 499, "Japan"],
    [500, 509, "United Kingdom"], [629, 629, "United Arab Emirates"], [690, 699, "China"], [760, 769, "Switzerland"],
    [800, 839, "Italy"], [890, 890, "India"], [930, 939, "Australia"]
  ];
  function region(g) {
    var p = +g.slice(0, 3);
    for (var i = 0; i < REGIONS.length; i++) if (p >= REGIONS[i][0] && p <= REGIONS[i][1]) return REGIONS[i][2];
    return "an unlisted region";
  }

  var DB = [
    {
      id: gt("501234500011"), name: "Northfield Oat Drink", size: "1 L", brand: "Northfield",
      chain: [
        { role: "Brand", name: "Northfield", note: "Chilled plant drinks" },
        { role: "Maker", name: "Meridian Foods Ltd", note: "Leeds, United Kingdom. Wholly owned." },
        { role: "Ultimate parent", name: "Halvorsen Group Holdings", note: "Listed holding company, 61 brands" }
      ],
      findings: [
        { c: "env", lvl: 2, tier: "regulator", yr: 2022, t: "Fined for repeated wastewater discharge above permit limits at a processing plant.", src: "Sample Environment Agency notice EA-22-0417" },
        { c: "env", lvl: 1, tier: "reporting", yr: 2024, t: "Palm oil in the wider group's range traced to suppliers that cleared protected forest in the past five years.", src: "Sample investigation, Ledger Review, March 2024" },
        { c: "law", lvl: 2, tier: "judgment", yr: 2021, t: "A group subsidiary was convicted of paying bribes to win a municipal supply contract and settled for $38 million.", src: "Sample case no. 21-CR-3302, Eastern District" },
        { c: "pol", lvl: 1, tier: "reporting", yr: 2023, t: "Reported $2.1 million in lobbying against packaging-recycling rules.", src: "Sample lobbying register filing LR-2023-9981" },
        { c: "pol", lvl: 0, tier: "record", yr: 2020, t: "The group's chair appears as a listed contact in unsealed court exhibits from an unrelated civil case.", src: "Sample exhibit index, Doc. 1114-7" }
      ],
      alts: [{ name: "Brook & Barley Oat Drink", owner: "Independent, Ireland" }, { name: "Quill Oat Milk", owner: "Quill Cooperative" }]
    },
    {
      id: gt("400987600034"), name: "Cove Sparkling Water", size: "12 x 330 ml", brand: "Cove",
      chain: [
        { role: "Brand", name: "Cove", note: "Flavoured sparkling water" },
        { role: "Maker", name: "Cove Beverage Co.", note: "Hamburg, Germany" },
        { role: "Ultimate parent", name: "Altamira Consumer Group", note: "Private equity owned since 2019" }
      ],
      findings: [
        { c: "env", lvl: 2, tier: "regulator", yr: 2023, t: "Groundwater extraction exceeded the licensed volume at one bottling site during a declared drought.", src: "Sample Water Authority order WA/23/118" },
        { c: "lab", lvl: 1, tier: "regulator", yr: 2022, t: "Safety citations at two bottling plants for blocked fire exits.", src: "Sample Labour Inspectorate report LI-4471" },
        { c: "pol", lvl: 0, tier: "allegation", yr: 2024, t: "Online posts claim a link between a senior executive and a political donor.", src: "No filing, ruling or news report found" }
      ],
      alts: [{ name: "Spring Line Mineral Water", owner: "Independent, Austria" }]
    },
    {
      id: gt("760321000077"), name: "Tessa & Moon Dark Chocolate 70%", size: "100 g", brand: "Tessa & Moon",
      chain: [
        { role: "Brand", name: "Tessa & Moon", note: "Premium chocolate bars" },
        { role: "Maker", name: "Orrin Confections AG", note: "Zurich, Switzerland" },
        { role: "Ultimate parent", name: "Vandermeer Global", note: "Listed, 14 confectionery brands" }
      ],
      findings: [
        { c: "lab", lvl: 2, tier: "reporting", yr: 2023, t: "Supplier audits found child labor on cocoa farms in the supply chain. The company's own sustainability report acknowledges gaps in monitoring.", src: "Sample joint investigation, Meridian Wire and Fieldwork Trust, 2023" },
        { c: "env", lvl: 1, tier: "reporting", yr: 2024, t: "No verified traceability for about 40% of cocoa volume, which leaves deforestation exposure unchecked.", src: "Sample company disclosure, Impact Report 2024, p. 31" }
      ],
      alts: [{ name: "Kalu Single-Origin 72%", owner: "Farmer-owned cooperative" }, { name: "Marrow & Co. Dark 70%", owner: "Independent, Belgium" }]
    },
    {
      id: gt("099887766554"), name: "Lumen Laundry Pods", size: "40 count", brand: "Lumen",
      chain: [
        { role: "Brand", name: "Lumen", note: "Household cleaning" },
        { role: "Maker", name: "Lumen Home Inc.", note: "Ohio, United States" },
        { role: "Ultimate parent", name: "Kestrel Household Brands", note: "Listed, 30 brands" }
      ],
      findings: [
        { c: "env", lvl: 1, tier: "judgment", yr: 2022, t: "Settled a class action over claims that the pods were fully biodegradable.", src: "Sample settlement, Case 3:21-cv-0782" },
        { c: "law", lvl: 1, tier: "regulator", yr: 2024, t: "Competition authority inquiry into price coordination, closed without penalty.", src: "Sample Competition Authority decision CA-24-031" }
      ],
      alts: [{ name: "Fennel Laundry Sheets", owner: "Independent, Canada" }]
    },
    {
      id: gt("800555000123"), name: "Greenfold Penne Rigate", size: "500 g", brand: "Greenfold",
      chain: [
        { role: "Brand", name: "Greenfold", note: "Dried pasta" },
        { role: "Maker and ultimate parent", name: "Greenfold Pasta S.r.l.", note: "Parma, Italy. Family owned, independent." }
      ],
      findings: [],
      alts: []
    }
  ];

  function byId(id) { for (var i = 0; i < DB.length; i++) if (DB[i].id === id) return DB[i]; return null; }
  function level(p, c) {
    var m = 0;
    p.findings.forEach(function (f) { if (f.c === c && SCORED[f.tier]) m = Math.max(m, f.lvl); });
    return m;
  }

  /* EAN-13 as SVG */
  var L = ["0001101","0011001","0010011","0111101","0100011","0110001","0101111","0111011","0110111","0001011"];
  var G = ["0100111","0110011","0011011","0100001","0011101","0111001","0000101","0010001","0001001","0010111"];
  var R = ["1110010","1100110","1101100","1000010","1011100","1001110","1010000","1000100","1001000","1110100"];
  var PAR = ["LLLLLL","LLGLGG","LLGGLG","LLGGGL","LGLLGG","LGGLLG","LGGGLL","LGLGLG","LGLGGL","LGGLGL"];
  function ean13(g) {
    var bits = "101", f = +g[0], i;
    for (i = 1; i <= 6; i++) bits += PAR[f][i - 1] === "L" ? L[+g[i]] : G[+g[i]];
    bits += "01010";
    for (i = 7; i <= 12; i++) bits += R[+g[i]];
    bits += "101";
    var rects = "", run = -1;
    for (i = 0; i <= bits.length; i++) {
      var on = i < bits.length && bits[i] === "1";
      if (on && run < 0) run = i;
      if (!on && run >= 0) { rects += '<rect x="' + run + '" y="0" width="' + (i - run) + '" height="40"/>'; run = -1; }
    }
    return '<svg viewBox="0 0 95 40" preserveAspectRatio="none" fill="currentColor" role="img" aria-label="Barcode ' + g + '">' + rects + "</svg>";
  }
  function spaced(g) { return g[0] + " " + g.slice(1, 7) + " " + g.slice(7); }

  var view = document.getElementById("view");

  function renderScan() {
    var shelf = DB.map(function (p) {
      return '<li><button type="button" data-id="' + p.id + '"><span class="meta"><span class="pname">' + p.name +
        '</span><span class="psub">' + p.size + '</span></span><span class="gtin">' + spaced(p.id) + "</span></button></li>";
    }).join("");
    view.innerHTML =
      "<h1>Who is behind the label?</h1>" +
      '<p class="lede">Scan a barcode to see who owns the brand and what public records say about the company.</p>' +
      '<div class="vf" id="vf"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>' +
      '<div class="laser"></div><p class="hint">Camera scanning comes with the full app. Pick a sample product below.</p><div class="code" id="vfcode"></div></div>' +
      "<h2>Sample shelf</h2>" +
      '<ul class="shelf">' + shelf + "</ul>" +
      "<h2>Or type a barcode</h2>" +
      '<form class="manual" id="manual" novalidate><label for="gtin-in" hidden>Barcode number</label>' +
      '<input id="gtin-in" inputmode="numeric" autocomplete="off" maxlength="17" placeholder="13-digit barcode">' +
      '<button class="btn" type="submit">Look up</button></form>' +
      '<p class="msg" id="msg" role="status" aria-live="polite"></p>' +
      '<p class="foot">Every company, finding and source in this prototype is invented. Nothing here describes a real business.</p>';

    var vf = document.getElementById("vf");
    view.querySelectorAll(".shelf button").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-id");
        document.getElementById("vfcode").innerHTML = ean13(id);
        vf.classList.add("scanning");
        window.setTimeout(function () { location.hash = "p-" + id; }, 850);
      });
    });
    var msg = document.getElementById("msg");
    document.getElementById("manual").addEventListener("submit", function (e) {
      e.preventDefault();
      var v = document.getElementById("gtin-in").value.replace(/[\s-]/g, "");
      msg.className = "msg";
      if (!/^\d{12,13}$/.test(v)) { msg.className = "msg bad"; msg.textContent = "Enter 12 or 13 digits, numbers only."; return; }
      if (v.length === 12) v = "0" + v;
      if (+v[12] !== check(v.slice(0, 12))) {
        msg.className = "msg bad";
        msg.textContent = "The last digit doesn't match the others. Recheck the number under the barcode.";
        return;
      }
      if (byId(v)) { location.hash = "p-" + v; return; }
      msg.textContent = "Valid barcode, issued in " + region(v) + ". It isn't in the sample database. The full app would search product and company registries here.";
    });
  }

  function renderResult(p) {
    var lv = CATS.map(function (c) { return level(p, c.k); });
    var flagged = lv.filter(function (x) { return x > 0; }).length;
    var scored = p.findings.filter(function (f) { return SCORED[f.tier]; }).length;
    var big = flagged === 0 ? "No documented findings in any of the four areas" : "Documented findings in " + flagged + " of 4 areas";

    var areas = CATS.map(function (c, i) {
      return '<div class="area"><span class="nm">' + c.n + '</span><span class="pill l' + lv[i] + '">' + LVL[lv[i]] + "</span></div>";
    }).join("");

    var chain = p.chain.map(function (n) {
      return '<li><span class="role">' + n.role + '</span><span class="who">' + n.name + '</span><div class="note">' + n.note + "</div></li>";
    }).join("");

    var sections = CATS.map(function (c, i) {
      var fs = p.findings.filter(function (f) { return f.c === c.k; });
      var body;
      if (!fs.length) {
        body = '<p class="none">Nothing found in the sample database.</p>';
      } else {
        body = '<ul class="finds">' + fs.map(function (f) {
          var sev = SCORED[f.tier] ? '<span class="chip sev' + f.lvl + '">' + LVL[f.lvl] + "</span>" : '<span class="chip">Not scored</span>';
          var cav = f.tier === "record" ? '<p class="caveat">Appearing in a record is not evidence of wrongdoing.</p>'
            : f.tier === "allegation" ? '<p class="caveat">Kept out of the rating until a source confirms it.</p>' : "";
          return "<li><div class=\"m\">" + sev + '<span class="chip">' + TIERS[f.tier] + '</span><span class="chip">' + f.yr + "</span></div>" +
            '<p class="t">' + f.t + '</p><p class="src">' + f.src + "</p>" + cav + "</li>";
        }).join("") + "</ul>";
      }
      return '<section class="cat"><header><h3>' + c.n + '</h3><span class="pill l' + lv[i] + '">' + LVL[lv[i]] + "</span></header>" + body + "</section>";
    }).join("");

    var alts = p.alts.length
      ? "<h2>Fewer findings in the sample</h2><ul class=\"alts\">" + p.alts.map(function (a) {
          return "<li><span class=\"pname\">" + a.name + '</span><span class="psub">' + a.owner + "</span></li>";
        }).join("") + "</ul>"
      : "";

    view.innerHTML =
      '<button class="back" type="button" id="back"><span aria-hidden="true">&larr;</span> Scan another</button>' +
      '<h1 tabindex="-1" id="ptitle">' + p.name + "</h1>" +
      '<p class="sub">' + p.size + "</p>" +
      '<div class="tag"><div class="bars">' + ean13(p.id) + '</div><div class="row"><span class="gtin">' + spaced(p.id) +
      '</span><span class="region">Barcode issued in ' + region(p.id) + "</span></div></div>" +
      '<div class="verdict"><p class="big">' + big + '</p><p class="sub" style="margin:0">' + scored +
      " scored finding" + (scored === 1 ? "" : "s") + " about the ultimate parent. This is a summary of public records, not a verdict on the company.</p>" +
      '<div class="areas">' + areas + "</div></div>" +
      "<h2>Who owns it</h2><ol class=\"chain\">" + chain + "</ol>" +
      "<h2>What the records say</h2>" + sections + alts +
      '<details><summary>How findings are weighed</summary><p>Court judgments, regulator findings and credible reporting count toward a rating. Each carries a year and a source so you can check it.</p>' +
      '<p>Unverified allegations and mentions in public records are shown separately and never scored. Being named in a document is not the same as doing something wrong.</p>' +
      '<p>Ratings describe the ultimate parent company, because the brand on the shelf is often owned several steps up.</p></details>' +
      '<p class="foot">Sample data. Every company, finding and source in this prototype is invented.</p>';

    document.getElementById("back").addEventListener("click", function () {
      location.hash = "";
    });
    document.getElementById("ptitle").focus({ preventScroll: true });
  }

  function route() {
    var h = location.hash.slice(1), p = null;
    if (h.indexOf("p-") === 0) p = byId(h.slice(2));
    if (p) renderResult(p); else renderScan();
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>

</html>
